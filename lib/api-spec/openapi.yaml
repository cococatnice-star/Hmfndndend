openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /delta-install:
    get:
      operationId: getDeltaInstallCount
      tags: [delta]
      summary: Get Delta install count
      description: Returns the number of recorded Delta install requests
      responses:
        "200":
          description: Current install count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeltaInstallCount"
    post:
      operationId: recordDeltaInstall
      tags: [delta]
      summary: Record a Delta install request
      description: Increments and returns the number of recorded Delta install requests
      responses:
        "200":
          description: Updated install count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeltaInstallCount"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DeltaInstallCount:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
      required:
        - count

